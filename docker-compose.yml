name: restaurant-pos-dev

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-database-boundaries.sh:/docker-entrypoint-initdb.d/20-database-boundaries.sh:ro
      - ./docker/postgres/platform-control-plane-prune.psql:/opt/restaurant/platform-control-plane-prune.psql:ro
    networks:
      - restaurant_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - restaurant_network

  backend:
    build: ./backend
    image: ${RESTAURANT_BACKEND_IMAGE:-restaurant-pos-dev-backend}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      IDENTITY_DATABASE: ${IDENTITY_DATABASE:-legacy}
      RESTAURANT_SERVICE_DATABASE: ${RESTAURANT_SERVICE_DATABASE:-legacy}
      RETAIL_SERVICE_DATABASE: ${RETAIL_SERVICE_DATABASE:-legacy}
      RETAIL_POSTGRES_DB: ${RETAIL_POSTGRES_DB:-retail_ops_db}
      RETAIL_REFERENCE_PROJECTOR_ENABLED: ${RETAIL_REFERENCE_PROJECTOR_ENABLED:-false}
      RETAIL_REFERENCE_PROJECTOR_POLL_SECONDS: ${RETAIL_REFERENCE_PROJECTOR_POLL_SECONDS:-5}
      TAKEAWAY_SERVICE_DATABASE: ${TAKEAWAY_SERVICE_DATABASE:-disabled}
      TAKEAWAY_POSTGRES_DB: ${TAKEAWAY_POSTGRES_DB:-takeaway_ops_db}
      TAKEAWAY_FEATURE_ENABLED: ${TAKEAWAY_FEATURE_ENABLED:-false}
      REFERENCE_PROJECTOR_ENABLED: ${REFERENCE_PROJECTOR_ENABLED:-false}
      REFERENCE_PROJECTOR_POLL_SECONDS: ${REFERENCE_PROJECTOR_POLL_SECONDS:-1}
      REFERENCE_PROJECTOR_BATCH_SIZE: ${REFERENCE_PROJECTOR_BATCH_SIZE:-100}
      SHARED_REPORTING_PROJECTOR_ENABLED: ${SHARED_REPORTING_PROJECTOR_ENABLED:-false}
      SHARED_REPORTING_PROJECTOR_POLL_SECONDS: ${SHARED_REPORTING_PROJECTOR_POLL_SECONDS:-5}
      SHARED_REPORTING_PROJECTOR_BATCH_SIZE: ${SHARED_REPORTING_PROJECTOR_BATCH_SIZE:-100}
      COMPANY_KITCHEN_WRITES_ENABLED: ${COMPANY_KITCHEN_WRITES_ENABLED:-false}
      COMPANY_DISTRIBUTION_WRITES_ENABLED: ${COMPANY_DISTRIBUTION_WRITES_ENABLED:-false}
    ports:
      - "${RESTAURANT_API_PORT:-8001}:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    # FIX S3-D-verify: avoid macOS Docker file-sharing failures when the repo lives under Google Drive
    networks:
      - restaurant_network

  frontend:
    build: ./frontend
    restart: unless-stopped
    # FIX S3-D-verify: frontend is served through nginx, so skip publishing 3000 to avoid local port conflicts
    depends_on:
      - backend
    # FIX S3-D-verify: run from the built source image instead of bind mounts that break on unshared cloud paths
    networks:
      - restaurant_network

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "${RESTAURANT_HTTP_PORT:-8081}:80"
    depends_on:
      - backend
      - frontend
    networks:
      - restaurant_network

networks:
  restaurant_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads:
