map $http_cf_connecting_ip $erp_client_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}

limit_req_zone $erp_client_ip zone=api:10m rate=30r/s;

server {
  listen 80;
  server_name _;

  # Cloudflare terminates public TLS. This origin is reachable only from the
  # cloudflared container and the production host loopback interface.
  resolver 127.0.0.11 ipv6=off;

  client_max_body_size 5M;

  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /health {
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $erp_client_ip;
    proxy_set_header X-Forwarded-For $erp_client_ip;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /api/ {
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
    limit_req zone=api burst=50 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $erp_client_ip;
    proxy_set_header X-Forwarded-For $erp_client_ip;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /webhooks/ {
    set $backend_upstream backend:8000;
    proxy_pass http://$backend_upstream;
    limit_req zone=api burst=50 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $erp_client_ip;
    proxy_set_header X-Forwarded-For $erp_client_ip;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /uploads/ {
    set $backend_upstream backend:8000;
    autoindex off;
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $erp_client_ip;
    proxy_set_header X-Forwarded-For $erp_client_ip;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    set $frontend_upstream frontend:80;
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $erp_client_ip;
    proxy_set_header X-Forwarded-For $erp_client_ip;
    proxy_set_header X-Forwarded-Proto https;
  }
}
